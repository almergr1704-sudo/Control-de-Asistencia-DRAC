name: Build Desktop Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web & Server
        run: npm run build

      - name: Build Windows Desktop (Installer & Portable ZIP)
        run: npx electron-builder --win nsis zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify compiled artifacts
        run: |
          Get-ChildItem -Path dist-desktop -Recurse -File | Select-Object Name, Length

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-desktop/DRAC-Asistencia-Setup.exe
            dist-desktop/DRAC-Asistencia-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
