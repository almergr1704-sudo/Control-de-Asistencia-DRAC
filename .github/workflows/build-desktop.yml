name: Compilar y Publicar DRAC Desktop Windows (GitHub Release)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Etiqueta de versión (ej: v1.0.0)'
        required: false
        default: ''
      release_name:
        description: 'Nombre de la Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Instalador Windows x64
    runs-on: windows-latest

    steps:
      - name: 1. Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Instalar dependencias del proyecto (incluyendo opcionales nativas)
        run: npm ci --include=optional || npm install --include=optional

      - name: 4. Comprobación obligatoria de módulos nativos para Windows
        shell: pwsh
        run: |
          Write-Host "=== Asegurando modulos nativos para Windows x64 ==="
          npm install --no-save --include=optional @rollup/rollup-win32-x64-msvc@4.62.4 @esbuild/win32-x64@0.25.12 lightningcss-win32-x64-msvc@1.32.0 @tailwindcss/oxide-win32-x64-msvc@4.3.3
          
          Write-Host "Verificando modulo nativo @rollup/rollup-win32-x64-msvc..."
          node -e "require('@rollup/rollup-win32-x64-msvc'); console.log('Rollup Windows native module OK')"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR CRÍTICO: No se pudo cargar el modulo nativo @rollup/rollup-win32-x64-msvc en Windows."
            exit 1
          }
          
          Write-Host "Verificando ejecucion nativa de esbuild para Windows..."
          node -e "require('esbuild').buildSync({ stdin: { contents: '' }, write: false }); console.log('esbuild Windows native module OK')"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR CRÍTICO: No se pudo ejecutar el binario nativo de esbuild en Windows."
            exit 1
          }

          Write-Host "Verificando modulo nativo lightningcss para Windows..."
          node -e "require('lightningcss'); console.log('LightningCSS Windows native module OK')"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR CRÍTICO: No se pudo cargar lightningcss en Windows."
            exit 1
          }

      - name: 5. Preparar recursos e icono institucional
        run: node scripts/prepare-build.cjs

      - name: 6. Compilar aplicación Web SPA y servidor (Vite + esbuild)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rfqgmoremevypexrrsyf.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmcWdtb3JlbWV2eXBleHJyc3lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjI3MTksImV4cCI6MjEwMzgzODcxOX0.L7VOne8N24590LxLZrYTmDPovu-Qs3Xibct6G0vhz5I' }}

      - name: 7. Compilar y empaquetar versión Desktop con Electron Builder (NSIS, Portable, ZIP)
        run: npx electron-builder --win nsis portable zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 8. Verificar y preparar artefactos de distribución
        shell: pwsh
        run: |
          Write-Host "=== Artefactos generados en dist-desktop ==="
          Get-ChildItem -Path dist-desktop -File | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize
          
          # Verificar existencia del instalador principal
          $setupExe = "dist-desktop/DRAC-Control-de-Asistencia-Setup.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Error "CRÍTICO: No se encontró el instalador principal en $setupExe. Se cancela la publicación de Release."
            exit 1
          }

          # Crear alias con nombres estandarizados para facilitar la descarga
          Copy-Item $setupExe -Destination "dist-desktop/DRAC-Asistencia-Setup.exe" -Force -Verbose
          
          $zipSource = Get-ChildItem -Path dist-desktop -Filter "*.zip" | Select-Object -First 1
          if ($zipSource) {
            Copy-Item $zipSource.FullName -Destination "dist-desktop/DRAC_ASISTENCIA_DESKTOP_WINDOWS.zip" -Force -Verbose
            Copy-Item $zipSource.FullName -Destination "dist-desktop/DRAC-Asistencia-Windows.zip" -Force -Verbose
          }

          if (Test-Path "dist-desktop/DRAC-Control-de-Asistencia-Portable.exe") {
            Copy-Item "dist-desktop/DRAC-Control-de-Asistencia-Portable.exe" -Destination "dist-desktop/DRAC-Asistencia-Portable.exe" -Force -Verbose
          }

          # Generar archivo de sumas de verificación SHA-256 para integridad de descarga
          Write-Host "=== Generando SHA256SUMS.txt ==="
          Get-FileHash -Path dist-desktop/*.exe, dist-desktop/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Out-File -FilePath "dist-desktop/SHA256SUMS.txt" -Encoding utf8
          
          Get-Content "dist-desktop/SHA256SUMS.txt"

      - name: 9. Subir instaladores como Artefactos de GitHub Actions (Descarga Directa)
        uses: actions/upload-artifact@v4
        with:
          name: DRAC-Control-de-Asistencia-Windows-x64
          path: |
            dist-desktop/DRAC-Control-de-Asistencia-Setup.exe
            dist-desktop/DRAC-Asistencia-Setup.exe
            dist-desktop/DRAC-Control-de-Asistencia-Portable.exe
            dist-desktop/DRAC-Asistencia-Portable.exe
            dist-desktop/*.zip
            dist-desktop/SHA256SUMS.txt
          retention-days: 60

      - name: 10. Determinar etiqueta y título de la Release
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $title = "DRAC Control de Asistencia Desktop $tag"
          } elseif ("${{ inputs.tag_name }}") {
            $tag = "${{ inputs.tag_name }}"
            $title = if ("${{ inputs.release_name }}") { "${{ inputs.release_name }}" } else { "DRAC Control de Asistencia Desktop $tag" }
          } else {
            $runNum = "${{ github.run_number }}"
            $tag = "v1.0.$runNum"
            $title = "DRAC Control de Asistencia Desktop v1.0.$runNum (Auto-Build)"
          }
          Write-Host "Release Tag: $tag"
          Write-Host "Release Title: $title"
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "title=$title" >> $env:GITHUB_OUTPUT

      - name: 11. Publicar en GitHub Releases con Assets Binarios
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## Sistema de Control de Asistencia Institucional - DRAC Cajamarca
            **Compilación Automatizada Desktop para Windows (x64)**

            ### 📦 Archivos Disponibles para Descarga:
            1. **`DRAC-Control-de-Asistencia-Setup.exe`** (Recomendado):
               - Instalador estándar asistido con accesos directos en Escritorio y Menú Inicio.
               - Soporte nativo para conexión con BioTime Console (`192.168.1.29:89` / PostgreSQL `7496`) y reloj biométrico G3-id (`192.168.1.180`).
            2. **`DRAC-Control-de-Asistencia-Portable.exe`**:
               - Ejecutable directo sin instalación previa (ideal para pruebas en servidor).
            3. **`DRAC_ASISTENCIA_DESKTOP_WINDOWS.zip`**:
               - Paquete zip portátil.
            4. **`SHA256SUMS.txt`**:
               - Firmas de integridad criptográfica SHA-256.

            ---
            *Compilado automáticamente mediante GitHub Actions.*
          files: |
            dist-desktop/DRAC-Control-de-Asistencia-Setup.exe
            dist-desktop/DRAC-Asistencia-Setup.exe
            dist-desktop/DRAC-Control-de-Asistencia-Portable.exe
            dist-desktop/DRAC-Asistencia-Portable.exe
            dist-desktop/DRAC_ASISTENCIA_DESKTOP_WINDOWS.zip
            dist-desktop/DRAC-Asistencia-Windows.zip
            dist-desktop/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

